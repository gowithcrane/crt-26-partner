<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#17556B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calgary Attendees">
<meta name="format-detection" content="telephone=no">
<title>Calgary Road Trip · Who’s Here</title>
<script>
  /* ====== SETUP: paste your Apps Script Web app URL (ends in /exec) between the quotes ====== */
  const API_URL = 'https://script.google.com/macros/s/AKfycbzyQpl0TirdUrCoM8yflGbTL8TDKMwNjeVVqNTZFjdHx8U1YXnGGiVN6owDeyCbDhlr/exec';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#17556B;--green:#5E9E3A;--orange:#E87722;--ink:#1A1A1A;--gray:#56636A;--line:#E3E6E8;--soft:#F4F6F7;--hdr:0px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--soft);color:var(--ink);font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit}
a{color:var(--teal)}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.wrap{max-width:1180px;margin:0 auto}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#BFE0A8}
.top h1{margin:2px 0 0;font-size:20px;line-height:1.2;font-weight:700}
.sync{font-size:12.5px;opacity:.85;margin-top:2px}
.sync b{color:#FFD2AE;font-weight:600}
.tools{display:flex;gap:8px;flex:0 0 auto}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.24)}
.search{margin-top:12px;position:relative}
.search input{width:100%;height:46px;border-radius:12px;border:0;padding:0 42px;font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none}
.search svg{position:absolute;left:13px;top:13px;color:var(--gray)}
.search .clear{position:absolute;right:6px;top:7px;width:32px;height:32px;border:0;background:none;color:var(--gray);font-size:22px;line-height:1;cursor:pointer}
.chips{display:flex;gap:8px;margin:10px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:#fff;border-color:#fff;color:var(--teal)}
.chip .n{opacity:.7;font-weight:400;margin-left:4px}

/* view tabs */
.views{display:inline-flex;gap:4px;margin-top:12px;padding:4px;background:rgba(255,255,255,.14);border-radius:12px}
.view{border:0;background:transparent;color:#fff;font-weight:600;font-size:14.5px;padding:8px 18px;border-radius:9px;cursor:pointer}
.view.on{background:#fff;color:var(--teal);cursor:default}
.view.ext{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.view.ext:hover{background:rgba(255,255,255,.18)}

/* layout */
.layout{max-width:1180px;margin:0 auto}
.meta{font-size:12.5px;color:var(--gray);padding:10px 16px 2px}
.list{list-style:none;margin:0;padding:6px 12px 48px}
.letter{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:1px;padding:14px 6px 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:12px;background:none;border:0;text-align:left;color:inherit;cursor:pointer}
.av{position:relative;flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:600;font-size:18px;overflow:hidden;border:1px solid var(--line)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.lg{width:96px;height:96px;font-size:30px}
.who{flex:1;min-width:0}
.nm{display:block;font-weight:600;font-size:16.5px;line-height:1.25}
.ti{display:block;font-size:14px;color:var(--gray);line-height:1.35;margin-top:1px}
.co{color:var(--ink);font-weight:500}
.loc{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--gray);margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.badge{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--gray)}
.badge.spk{background:#FDEBDD;color:#B0540F}
.badge.prt{background:#E7F2E0;color:#3E7424}
.badge.fu{background:var(--orange);color:#fff}
.badge.nt{background:#FFF4D6;color:#8A6400}
.chev{flex:0 0 auto;color:#A9B3B8;transition:transform .15s}
.card.open .chev{transform:rotate(90deg)}
.card.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}

/* detail */
.detail{padding:2px 14px 16px;border-top:1px solid var(--line)}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.hero h2{margin:0;font-size:22px;line-height:1.2}
.hl{margin:12px 0 0;font-size:15px;line-height:1.5}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:14px}
.act{display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.act.pri{background:var(--teal);color:#fff}
.box{margin-top:14px;border-radius:12px;padding:12px 14px;background:#FFF8EF;border-left:4px solid var(--orange)}
.box h3{margin:0 0 4px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--gray)}
.box p{margin:0;font-size:15px;line-height:1.5;white-space:pre-wrap}
.facts{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14.5px}
.facts dt{color:var(--gray);font-weight:500}
.facts dd{margin:0}
.notes{margin-top:16px}
.notes .lbl{display:block;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--gray);font-weight:600;margin-bottom:6px}
.notes textarea{width:100%;min-height:120px;border-radius:12px;border:1.5px solid var(--line);padding:12px;font-size:16px;line-height:1.45;resize:vertical;outline:none;background:#fff}
.notes textarea:focus{border-color:var(--teal)}
.save-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;cursor:pointer;user-select:none}
.toggle input{width:22px;height:22px;accent-color:var(--orange)}
.save{margin-left:auto;height:44px;padding:0 22px;border-radius:12px;border:0;background:var(--orange);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.save:disabled{opacity:.55}
.saved{font-size:13px;color:var(--gray);width:100%}
.saved.ok{color:var(--green)} .saved.wait{color:#8A6400}
.hint{font-size:12px;color:#8B969B;margin-top:4px}
.empty{text-align:center;color:var(--gray);padding:40px 16px}

/* desktop: list + side panel */
.panel{display:none}
@media (min-width:900px){
  .top{padding-left:24px;padding-right:24px}
  .layout{display:grid;grid-template-columns:420px 1fr;gap:20px;padding:0 24px}
  .list{padding:6px 0 48px}
  .meta{padding:12px 4px 2px}
  .panel{display:block;position:sticky;top:calc(var(--hdr) + 16px);align-self:start;margin-top:16px;max-height:calc(100vh - var(--hdr) - 32px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .panel .detail{border:0;padding:0}
  .panel .ph{color:var(--gray);text-align:center;padding:60px 20px}
  .card .detail{display:none}
}

/* passcode gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--teal)}
.gate-card{background:#fff;border-radius:20px;padding:30px 24px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.gate-logo{display:block;width:190px;max-width:70%;height:auto;margin:0 auto 18px}
.gate-card h1{margin:0;font-size:24px;line-height:1.2;color:var(--teal)}
.gate-dates{margin-top:4px;font-size:14px;font-weight:600;color:var(--green)}
.gate-card p{color:var(--gray);font-size:15px;line-height:1.5;margin:14px 0 20px}
.gate-card input{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font-size:17px;text-align:center;outline:none;background:var(--soft)}
.gate-card input:focus{border-color:var(--teal);background:#fff}
.gate-card button{margin-top:10px;width:100%;height:50px;border-radius:12px;border:0;background:var(--orange);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
.gate-err{color:#B3261E;font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>

<section id="gate" class="gate hidden">
  <form class="gate-card" id="gateForm">
    <img class="gate-logo" src="https://housinginnovationalliance.com/wp-content/uploads/calgary-rt-roadtrip-logo.jpg" alt="Housing Innovation Alliance Road Trip" onerror="this.remove()">
    <h1>Calgary Road Trip</h1>
    <div class="gate-dates">Oct 21–22, 2026 · Calgary, AB</div>
    <p>A quick reference to who’s on the trip, built to help you get the most out of the experience.</p>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Enter passcode" aria-label="Passcode" required>
    <button type="submit">View attendees</button>
    <div class="gate-err" id="gateErr"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top" id="top"><div class="wrap">
    <div class="top-row">
      <div>
        <div class="eyebrow">Housing Innovation Alliance · Road Trip Guide</div>
        <h1>Calgary Road Trip Attendees</h1>
        <div class="sync hidden" id="sync"></div>
      </div>
      <div class="tools">
        <button class="iconbtn" id="refresh" title="Refresh" aria-label="Refresh">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
        <button class="iconbtn" id="lock" title="Lock this device" aria-label="Lock">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      </div>
    </div>
    <nav class="views">
      <span class="view on">Roster</span>
      <a class="view ext" href="https://housinginnovationalliance.com/calgary-road-trip-2026/" target="_blank" rel="noopener">Agenda <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></a>
    </nav>
    <div id="rosterControls">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, company, school…" autocomplete="off" enterkeyhint="search">
      <button class="clear hidden" id="clear" aria-label="Clear search">×</button>
    </div>
    <nav class="chips" id="chips"></nav>
    </div>
  </div></header>
  <main class="layout" id="rosterView">
    <section>
      <div class="meta" id="meta"></div>
      <ul class="list" id="list"></ul>
    </section>
    <aside class="panel" id="panel"><div class="ph">Select a person to see details and take notes.</div></aside>
  </main>
</div>

<script>
/* Photo fallback: Drive thumbnail -> Drive image host -> initials */
function photoFail(img){
  const m = img.src.match(/drive\.google\.com\/thumbnail\?id=([^&]+)/);
  if (m && !img.dataset.alt){ img.dataset.alt = '1'; img.src = 'https://lh3.googleusercontent.com/d/' + m[1] + '=w400'; return; }
  img.remove();
}
(function(){
const LS = {key:'pr_key', data:'pr_data', queue:'pr_queue', drafts:'pr_drafts'};
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const desktop = matchMedia('(min-width:900px)');
const PIN = '<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

let key = store.get(LS.key, '');
let people = [];
let queue = store.get(LS.queue, {});    // id -> {notes, followUp, at}   (not yet saved to the Sheet)
let drafts = store.get(LS.drafts, {});  // id -> text typed but not saved
let filter = 'all', query = '', sel = null;

const yes = v => /^y/i.test(String(v||'').trim());
const cur = p => queue[p.ID] || {notes: p['Dennis Notes']||'', followUp: yes(p['Follow Up'])};
const nameOf = p => `${p['First Name']||''} ${p['Last Name']||''}`.trim();
const initials = p => ((p['First Name']||'')[0]||'') + ((p['Last Name']||'')[0]||'');
const telOf = v => { const d = String(v||'').replace(/[^\d+]/g,''); return d.length >= 10 ? d : ''; };
const FILTERS = [
  ['all','Everyone', () => true],
  ['wed','Wed', p => yes(p['Wed (Platform)'])],
  ['thu','Thu tours', p => yes(p['Thu (Tours)'])],
  ['spk','Speakers', p => /yes|maybe/i.test(p['Speaker']||'')],
  ['prt','Partners', p => !!p['Partner']],
];

/* ---------- API ---------- */
async function api(method, payload){
  if (!API_URL || API_URL.startsWith('PASTE')) throw new Error('Setup needed: paste the Apps Script URL into index.html.');
  const res = method === 'GET'
    ? await fetch(API_URL + '?key=' + encodeURIComponent(key) + '&t=' + Date.now())
    : await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({key}, payload))});
  const j = await res.json();
  if (!j.ok){ const e = new Error(j.error || 'Request failed'); e.code = j.error; throw e; }
  return j;
}
async function load(fromGate){
  const cached = store.get(LS.data, null);
  if (cached && !people.length){ people = cached.people; showApp(); render(); setSync(cached.synced, true); }
  try{
    const j = await api('GET');
    people = j.people; store.set(LS.data, {people, synced: j.synced});
    showApp(); render(); setSync(j.synced, false); flush();
    return true;
  }catch(e){
    if (e.code === 'unauthorized'){ store.del(LS.key); store.del(LS.data); key = ''; people = []; showGate('That passcode didn’t work.'); return false; }
    if (!cached){ if (fromGate) showGate(navigator.onLine ? e.message : 'You’re offline — connect once to load the roster.'); return false; }
    $('#sync').textContent = 'Offline · showing the copy saved on this device'; return true;
  }
}
function setSync(t, stale){
  const s = t ? new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
  $('#sync').innerHTML = (stale ? 'Saved copy' : 'Synced with the Sheet') + (s ? ' · ' + s : '') + pendingHTML();
}
function pendingHTML(){ const n = Object.keys(queue).length; return n ? ` · <b>${n} note${n>1?'s':''} waiting to sync</b>` : ''; }
function refreshPending(){ const el = $('#sync'); el.innerHTML = el.innerHTML.replace(/ · <b>.*<\/b>$/, '') + pendingHTML(); }

/* ---------- notes: saved to the Sheet, queued on the device if offline ---------- */
async function saveNote(id, notes, followUp){
  queue[id] = {notes, followUp, at: Date.now()}; store.set(LS.queue, queue);
  delete drafts[id]; store.set(LS.drafts, drafts);
  refreshPending();
  return flushOne(id);
}
async function flushOne(id){
  const item = queue[id]; if (!item) return {ok:true};
  try{
    const j = await api('POST', {id, notes: item.notes, followUp: item.followUp});
    const p = people.find(x => x.ID === id);
    if (p){ p['Dennis Notes'] = item.notes; p['Follow Up'] = item.followUp ? 'Yes' : ''; p['Notes Updated'] = j.updated; }
    if (queue[id] && queue[id].at === item.at) delete queue[id];
    store.set(LS.queue, queue); store.set(LS.data, {people, synced: new Date().toISOString()});
    refreshPending(); return {ok:true, when:j.updated};
  }catch(e){
    if (e.code === 'unauthorized') showGate('Your passcode changed — enter it again.');
    refreshPending(); return {ok:false};
  }
}
async function flush(){ for (const id of Object.keys(queue)) await flushOne(id); }
addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && key) flush(); });

/* ---------- render ---------- */
function hay(p){ return [nameOf(p), p['Company'], p['Job Title'], p['Headline'], p['Location'], p['School 1'], p['School 2'], ].join(' ').toLowerCase(); }
function badgesHTML(p){
  const b = [];
  if (yes(p['Speaker'])) b.push('<span class="badge spk">Speaker</span>');
  else if (/maybe/i.test(p['Speaker']||'')) b.push('<span class="badge spk">Speaker?</span>');
  if (p['Partner']) b.push(`<span class="badge prt">${esc(p['Partner'])}</span>`);
  const c = cur(p);
  return b.join('');
}
function avatar(p, lg){
  const img = p['Photo URL'] ? `<img src="${esc(p['Photo URL'])}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="photoFail(this)">` : '';
  return `<span class="av ${lg?'lg':''}">${esc(initials(p))}${img}</span>`;
}
function rowHTML(p){
  return `<button class="row" aria-expanded="${sel===p.ID}">
    ${avatar(p)}
    <span class="who">
      <span class="nm">${esc(nameOf(p))}</span>
      <span class="ti">${esc(p['Job Title'])}${p['Job Title']&&p['Company']?' · ':''}<span class="co">${esc(p['Company'])}</span></span>
      ${p['Location'] ? `<span class="loc">${PIN}${esc(p['Location'])}</span>` : ''}
      <span class="badges">${badgesHTML(p)}</span>
    </span>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
  </button>`;
}
function detailHTML(p, withHero){
  const c = cur(p), draft = drafts[p.ID];
  const tel = telOf(p['Phone']);
  const schools = [p['School 1'], p['School 2']].filter(Boolean).map(esc).join('<br>');
  const days = [yes(p['Wed (Platform)'])?'Wed (Platform)':'', yes(p['Thu (Tours)'])?'Thu (Tours)':''].filter(Boolean).join(', ');
  const facts = [
    ['Email', p['Email'] ? esc(p['Email']) : ''],
    ['Phone', p['Phone'] ? esc(p['Phone']) : ''],
    ['Location', esc(p['Location'])],
    ['Education', schools],
    ['Attending', days],
  ].filter(f => f[1]);
  const acts = [
    p['Email'] ? `<a class="act pri" href="mailto:${esc(p['Email'])}">Email</a>` : '',
    p['LinkedIn'] ? `<a class="act" href="${esc(p['LinkedIn'])}" target="_blank" rel="noopener">LinkedIn</a>` : '',
    p['Company Website'] ? `<a class="act" href="${esc(p['Company Website'])}" target="_blank" rel="noopener">Website</a>` : '',
    tel ? `<a class="act" href="sms:${tel}">Text</a>` : '',
    tel ? `<a class="act" href="tel:${tel}">Call</a>` : '',
  ].join('');
  const stamp = queue[p.ID] ? '<span class="saved wait">Saved on this device · will sync to the Sheet when online</span>'
              : p['Notes Updated'] ? `<span class="saved">Last saved to the Sheet ${esc(p['Notes Updated'])}</span>` : '<span class="saved"></span>';
  const prep = (p['Prep Notes']||'').trim();
  return `<div class="detail" data-id="${esc(p.ID)}">
    ${withHero ? `<div class="hero">${avatar(p,true)}<div><h2>${esc(nameOf(p))}</h2>
       <div class="ti">${esc(p['Job Title'])}${p['Job Title']&&p['Company']?' · ':''}<span class="co">${esc(p['Company'])}</span></div>
       <div class="badges">${badgesHTML(p)}</div></div></div>` : ''}
    ${p['Headline'] ? `<p class="hl">${esc(p['Headline'])}</p>` : ''}
    ${acts ? `<div class="actions">${acts}</div>` : ''}
    ${facts.length ? `<dl class="facts">${facts.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
  </div>`;
}
function sortKey(p){ const l = (p['Last Name']||'').trim(), f = (p['First Name']||'').trim();
  return (/^[a-z]/i.test(l) ? '0' : '1') + l.toLowerCase() + ' ' + f.toLowerCase(); }
function letterOf(p){ const c = ((p['Last Name']||'').trim()[0]||'').toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; }
function visible(){
  const fn = FILTERS.find(f => f[0] === filter)[2];
  const words = query.split(/\s+/).filter(Boolean);
  return people.filter(p => fn(p) && words.every(w => hay(p).includes(w)))
    .sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
}
function render(){
  $('#chips').innerHTML = FILTERS.map(([id,label,fn]) => `<button class="chip ${filter===id?'on':''}" data-f="${id}">${label}<span class="n">${people.filter(fn).length}</span></button>`).join('');
  const shown = visible();
  $('#meta').textContent = shown.length === people.length ? `${people.length} people · A–Z by last name` : `${shown.length} of ${people.length} people`;
  let html = '', last = '';
  for (const p of shown){
    const L = letterOf(p);
    if (!query && filter === 'all' && L !== last){ html += `<li class="letter" aria-hidden="true">${esc(L)}</li>`; last = L; }
    const open = sel === p.ID;
    html += `<li class="card ${open ? (desktop.matches ? 'sel' : 'open') : ''}" data-id="${esc(p.ID)}">${rowHTML(p)}${open && !desktop.matches ? detailHTML(p,false) : ''}</li>`;
  }
  $('#list').innerHTML = html || '<li class="empty">No one matches.</li>';
  renderPanel();
}
function renderPanel(){
  const p = people.find(x => x.ID === sel);
  $('#panel').innerHTML = p && desktop.matches ? detailHTML(p, true) : '<div class="ph">Select a person to see details and take notes.</div>';
}
function updateBadges(id){
  const p = people.find(x => x.ID === id); if (!p) return;
  document.querySelectorAll(`.card[data-id="${CSS.escape(id)}"] .badges, .panel .hero .badges`).forEach(el => el.innerHTML = badgesHTML(p));
  $('#chips').querySelectorAll('.chip').forEach(ch => { const f = FILTERS.find(x => x[0] === ch.dataset.f); ch.querySelector('.n').textContent = people.filter(f[2]).length; });
}

/* ---------- events ---------- */
$('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); $('#clear').classList.toggle('hidden', !query); render(); });
$('#clear').addEventListener('click', () => { $('#q').value = ''; query = ''; $('#clear').classList.add('hidden'); render(); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; filter = b.dataset.f; render(); scrollTo({top:0}); });
$('#list').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = row.closest('.card').dataset.id;
  sel = (sel === id && !desktop.matches) ? null : id;
  render();
  if (!desktop.matches && sel){
    const c = document.querySelector(`.card[data-id="${CSS.escape(sel)}"]`);
    const hdr = $('#top').offsetHeight;
    if (c.getBoundingClientRect().top < hdr + 4) scrollTo({top: c.getBoundingClientRect().top + scrollY - hdr - 8, behavior:'smooth'});
  }
});
async function doSave(detail){
  const id = detail.dataset.id, btn = detail.querySelector('.save');
  const notes = detail.querySelector('textarea').value, fu = detail.querySelector('.fu').checked;
  btn.disabled = true; btn.textContent = 'Saving…';
  const r = await saveNote(id, notes, fu);
  btn.disabled = false; btn.textContent = 'Save note';
  const s = detail.querySelector('.saved');
  if (r.ok){ s.className = 'saved ok'; s.textContent = 'Saved to the Sheet' + (r.when ? ' · ' + r.when : ''); }
  else { s.className = 'saved wait'; s.textContent = 'Saved on this device · will sync to the Sheet when online'; }
  updateBadges(id);
}
document.addEventListener('click', e => { const b = e.target.closest('.detail .save'); if (b) doSave(b.closest('.detail')); });
document.addEventListener('input', e => {
  if (!e.target.matches('.detail textarea')) return;
  drafts[e.target.closest('.detail').dataset.id] = e.target.value; store.set(LS.drafts, drafts);
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.matches('.detail textarea')){ e.preventDefault(); doSave(e.target.closest('.detail')); }
});
$('#refresh').addEventListener('click', async () => { await flush(); await load(false); });
$('#lock').addEventListener('click', () => {
  if (!confirm('Lock the roster on this device? The passcode and the saved copy will be removed.')) return;
  [LS.key, LS.data, LS.queue, LS.drafts].forEach(store.del); key = ''; people = []; queue = {}; drafts = {}; sel = null; showGate('');
});
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault(); key = $('#pass').value.trim(); $('#gateErr').textContent = 'Checking…';
  if (await load(true)){ store.set(LS.key, key); $('#gateErr').textContent = ''; $('#pass').value = ''; }
});
desktop.addEventListener('change', render);
new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', $('#top').offsetHeight + 'px')).observe($('#top'));

function showGate(msg){ $('#app').classList.add('hidden'); $('#gate').classList.remove('hidden'); $('#gateErr').textContent = msg || ''; }
function showApp(){ $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden'); }
if (key) load(true); else showGate('');
})();
</script>
</body>
